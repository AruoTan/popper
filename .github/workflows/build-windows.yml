name: Build Windows installer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc
      CARGO_INCREMENTAL: "0"
      # CI needs test results, not large MSVC debug-symbol/PDB files. Keep
      # debug assertions and overflow checks; release settings are unchanged.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false

      - name: Set up pnpm
        id: pnpm
        run: |
          $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          if ($packageManager -notmatch '^pnpm@\d+\.\d+\.\d+$') {
            throw "Expected an exact pnpm version in package.json"
          }
          npm install --global $packageManager
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
          $store = pnpm store path --silent
          if ($LASTEXITCODE -ne 0 -or -not $store) { throw 'pnpm store lookup failed' }
          "store=$store" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$packageManager" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: windows-2022-x64-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            windows-2022-x64-${{ steps.pnpm.outputs.version }}-

      - name: Install locked JavaScript dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Set up Rust and NASM
        id: native-tools
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          if (-not (Test-Path -LiteralPath (Join-Path $nasmDirectory 'nasm.exe'))) {
            throw 'NASM executable was not installed at the expected location'
          }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $tauriCache = Join-Path $env:LOCALAPPDATA 'tauri'
          "tauri-cache=$tauriCache" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache Rust dependencies and compilation artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: windows-2022-x64-msvc
          cache-bin: "false"
          # NSIS, its Tauri plugin and WebView2 installer downloads are reusable.
          cache-directories: ${{ steps.native-tools.outputs.tauri-cache }}

      - name: Verify and package Windows x64
        run: ./.github/scripts/build-windows.ps1

      - name: Upload installer, portable ZIP, Scoop manifest and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Popper-windows-x64-${{ github.run_number }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/distribution/*_x64-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/distribution/*_x64-portable.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/distribution/popper.json
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/distribution/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
